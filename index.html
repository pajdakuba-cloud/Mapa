<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Karavan Komunita & Cestování</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; background: #0f172a; }
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Horní vyhledávací lišta */
    .floating-header {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
      pointer-events: none;
    }
    .interactive-ui { pointer-events: auto; }

    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      display: flex;
      background: white;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      overflow: hidden;
      padding: 3px 6px 3px 16px;
      height: 46px;
      align-items: center;
    }
    .search-box input { flex: 1; border: none; font-size: 15px; outline: none; background: transparent; }
    .search-box button { background: #2563eb; color: white; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; }

    .gear-btn {
      width: 46px;
      height: 46px;
      background: white;
      border: none;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-results {
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    .search-item { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; font-size: 13px; }
    .search-item:hover { background: #f8fafc; }

    /* Karta naplánované trasy */
    .route-info-card {
      position: absolute;
      bottom: 24px;
      left: 14px;
      right: 14px;
      max-width: 420px;
      margin: 0 auto;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      padding: 14px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: none;
      backdrop-filter: blur(8px);
    }
    .route-info-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .route-details { font-size: 14px; color: #94a3b8; }
    .route-details strong { color: #38bdf8; font-size: 16px; }
    .route-actions { display: flex; gap: 8px; margin-top: 10px; }

    /* Tlačítko GPS vpravo dole */
    .gps-btn {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 999;
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0284c7;
    }

    /* Piny na mapě */
    .custom-pin { width: 38px !important; height: 48px !important; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4)); }
    .pin-wrap { position: relative; width: 38px; height: 48px; }
    .pin-icon { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 16px; }

    /* Modály */
    .overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      z-index: 2500;
    }
    .modal {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2600;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
      width: 92%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      position: sticky;
      top: -20px;
      background: white;
      padding: 10px 0 6px 0;
      z-index: 10;
      border-bottom: 1px solid #f1f5f9;
    }
    .modal-header h3 { font-size: 18px; color: #0f172a; margin: 0; }
    
    .close-modal-btn {
      background: #f1f5f9;
      border: none;
      font-size: 18px;
      font-weight: bold;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-modal-btn:hover { background: #e2e8f0; }

    .modal label { display: block; margin: 12px 0 4px; font-size: 12px; font-weight: bold; color: #475569; }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
    }
    .modal textarea { min-height: 65px; resize: vertical; }

    .map-toggle-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .map-radio-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
    }
    .map-radio-card input { width: auto; }

    .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }

    .photo-preview { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
    .review-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 8px; }
    .gallery { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
    .gallery img { width: 90px; height: 70px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Horní vyhledávací lišta + Nastavení -->
  <div class="floating-header">
    <div class="header-row interactive-ui">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Hledat cíl, město nebo adresu..." onkeydown="if(event.key==='Enter') searchLocation()">
        <button onclick="searchLocation()">🔍</button>
      </div>
      <button class="gear-btn" onclick="openSettingsModal()" title="Nastavení & Účet">⚙️</button>
    </div>
    <div id="searchResults" class="search-results interactive-ui"></div>
  </div>

  <!-- Karta plánované trasy -->
  <div id="routeInfoCard" class="route-info-card">
    <div class="route-info-header">
      <span style="font-weight:bold;font-size:15px;">🚗 Trasa</span>
      <button onclick="clearRoute()" style="background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;">✕</button>
    </div>
    <div class="route-details">
      Vzdálenost: <strong id="routeDistance">0 km</strong> | Čas: <strong id="routeTime">0 min</strong>
    </div>
    <div class="route-actions">
      <a id="extNavBtn" href="#" target="_blank" class="btn btn-success" style="flex:1;text-align:center;text-decoration:none;">🧭 Spustit navigaci</a>
      <button class="btn btn-secondary" onclick="clearRoute()">Zrušit</button>
    </div>
  </div>

  <!-- Tlačítko GPS -->
  <button class="gps-btn" onclick="locateMe()" title="Moje poloha">📍</button>

  <div id="map"></div>
  <div id="overlay" class="overlay" onclick="closeAllModals()"></div>

  <!-- 1. Modál Nastavení & Účet -->
  <div id="settingsModal" class="modal">
    <div class="modal-header">
      <h3>⚙️ Nastavení & Účet</h3>
      <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
    </div>

    <label>🛰️ Zobrazení mapy</label>
    <div class="map-toggle-group">
      <label class="map-radio-card">
        <input type="radio" name="mapViewRadio" value="osm" checked onchange="changeMapLayer('osm')">
        <span>🗺️ Běžná silniční mapa</span>
      </label>
      <label class="map-radio-card">
        <input type="radio" name="mapViewRadio" value="sat" onchange="changeMapLayer('sat')">
        <span>🛰️ Satelitní / Letecké zobrazení</span>
      </label>
      <label class="map-radio-card">
        <input type="radio" name="mapViewRadio" value="topo" onchange="changeMapLayer('topo')">
        <span>🌲 Turistická / Vrstevnice</span>
      </label>
    </div>

    <hr style="border:none;border-top:1px solid #e2e8f0;margin:18px 0 10px;">

    <label>👤 Účet karavanisty</label>
    <div id="settingsUserBox" style="background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #e2e8f0;margin-bottom:12px;">
      <div id="userAccountText" style="font-weight:600;font-size:14px;color:#1e293b;">Nepřihlášený uživatel</div>
    </div>

    <div id="authFieldsSection">
      <label>E-mail *</label>
      <input type="email" id="authEmail" placeholder="vas@email.cz">
      <label>Heslo (min. 6 znaků) *</label>
      <input type="password" id="authPassword" placeholder="••••••••">
      <p style="font-size:11px;color:#64748b;margin-top:6px;">⚠️ Při registraci obdržíte e-mail s ověřovacím odkazem pro aktivaci účtu.</p>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-primary" style="flex:1" onclick="handleLogin()">Přihlásit se</button>
        <button class="btn btn-secondary" style="flex:1" onclick="handleRegister()">Registrovat</button>
      </div>
    </div>

    <div id="logoutSection" style="display:none;margin-top:10px;">
      <button class="btn btn-danger" style="width:100%" onclick="handleLogout()">Odhlásit se</button>
    </div>

    <hr style="border:none;border-top:1px solid #e2e8f0;margin:18px 0 10px;">
    <button class="btn btn-secondary" style="width:100%" onclick="loadPointsFromCloud(); closeAllModals();">🔄 Znovu načíst body z cloudu</button>
  </div>

  <!-- 2. Modál Přidání místa -->
  <div id="placeModal" class="modal">
    <div class="modal-header">
      <h3>🚐 Přidat nové místo</h3>
      <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
    </div>
    <input type="hidden" id="pLat">
    <input type="hidden" id="pLng">

    <label>Název místa *</label>
    <input type="text" id="pTitle" placeholder="např. Stellplatz Lipno, Louka u rybníka...">

    <label>Viditelnost místa</label>
    <select id="pPrivacy" style="background:#f8fafc;font-weight:600;">
      <option value="false">🌐 Veřejné (vidí celá komunita)</option>
      <option value="true">🔒 Soukromé (vidím pouze já)</option>
    </select>

    <label>Kategorie</label>
    <select id="pCategory">
      <option value="🚐|Stellplatz / Kemp|#3b82f6">🚐 Stellplatz / Kemp</option>
      <option value="🌲|Spaní na divoko|#10b981">🌲 Spaní na divoko / Příroda</option>
      <option value="💧|Voda a výlevka|#06b6d4">💧 Pitná voda / Výlevka</option>
      <option value="⛽|Čerpací stanice / LPG|#f97316">⛽ Benzínka / LPG</option>
      <option value="📸|Vyhlídka / Cíl cesty|#8b5cf6">📸 Vyhlídka / Výlet</option>
      <option value="⚠️|Pozor / Nízký podjezd|#ef4444">⚠️ Pozor / Nízký podjezd</option>
    </select>

    <label>Popis / Poznámky (cena, vjezd, povrch)</label>
    <textarea id="pDesc" placeholder="Podrobnosti o místě..."></textarea>

    <label>Hlavní fotografie</label>
    <input type="file" id="pPhoto" accept="image/*" onchange="previewImage(event, 'pPreview')">
    <img id="pPreview" class="photo-preview" alt="Náhled">

    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
      <button class="btn btn-secondary" onclick="closeAllModals()">Zrušit</button>
      <button class="btn btn-primary" onclick="savePlaceToCloud()">Uložit místo</button>
    </div>
  </div>

  <!-- 3. Modál Detail místa -->
  <div id="detailModal" class="modal">
    <div class="modal-header">
      <h3 id="dTitle"></h3>
      <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
    </div>

    <div id="dCategoryBadge" style="margin-bottom:10px;display:flex;gap:6px;"></div>
    
    <div id="dGallery" class="gallery"></div>
    <p id="dDesc" style="font-size:14px;color:#334155;margin:10px 0;line-height:1.4;"></p>
    <small id="dAuthor" style="color:#64748b;font-size:11px;display:block;margin-bottom:12px;"></small>

    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button id="dPlanRouteBtn" class="btn btn-primary" style="flex:1;">🗺️ Trasa na mapě</button>
      <a id="dNavBtn" href="#" target="_blank" class="btn btn-success" style="flex:1;text-align:center;text-decoration:none;">🧭 Navigovat</a>
    </div>

    <div id="ownerActions" style="display:none;margin-bottom:14px;">
      <button class="btn btn-danger" style="width:100%" onclick="deletePlaceAsOwner()">🗑️ Smazat moje místo</button>
    </div>

    <hr style="border:none;border-top:1px solid #e2e8f0;margin:14px 0;">
    <h4 style="font-size:15px;color:#0f172a;margin-bottom:8px;">💬 Recenze</h4>
    <div id="reviewsList" style="margin-bottom:14px;"></div>

    <div style="background:#f1f5f9;padding:12px;border-radius:10px;margin-bottom:14px;">
      <h5 style="margin-bottom:6px;font-size:13px;">Přidat recenzi & foto</h5>
      <select id="rStars" style="margin-bottom:6px;">
        <option value="5">⭐⭐⭐⭐⭐ (Super 5/5)</option>
        <option value="4">⭐⭐⭐⭐ (Velmi dobré 4/5)</option>
        <option value="3">⭐⭐⭐ (Průměr 3/5)</option>
        <option value="2">⭐⭐ (Slabé 2/5)</option>
        <option value="1">⭐ (Nedoporučuji 1/5)</option>
      </select>
      <textarea id="rComment" placeholder="Zkušenosti, stav vody, cena..."></textarea>
      <input type="file" id="rPhoto" accept="image/*" style="margin-top:6px;" onchange="previewImage(event, 'rPreview')">
      <img id="rPreview" class="photo-preview" alt="Náhled recenze">
      <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="submitReview()">Odeslat recenzi</button>
    </div>

    <button class="btn btn-secondary" style="width:100%;padding:12px;" onclick="closeAllModals()">✕ Zavřít detail místa</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Supabase klient
    var SUPABASE_URL = "https://cxnpnpdfwpryaqnjxqje.supabase.co";
    var SUPABASE_KEY = "sb_publishable_0_V8KaoTWJZCpj4BSNPCKw_L8vNceRC";
    var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var currentUser = null;
    var userCurrentPos = null;
    var userLocationMarker = null;
    var places = [];
    var currentDetailPlace = null;
    var tempPhotoBase64 = "";
    var tempReviewPhotoBase64 = "";

    // 2. Mapové podklady
    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
    var topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenTopoMap' });

    var currentActiveLayer = osmLayer;
    var map = L.map('map', { tap: false, layers: [currentActiveLayer], zoomControl: false }).setView([49.8175, 15.4730], 8);

    var markersLayer = L.layerGroup().addTo(map);
    var routeLayerGroup = L.layerGroup().addTo(map);

    function changeMapLayer(type) {
      map.removeLayer(currentActiveLayer);
      if (type === 'sat') currentActiveLayer = satelliteLayer;
      else if (type === 'topo') currentActiveLayer = topoLayer;
      else currentActiveLayer = osmLayer;
      map.addLayer(currentActiveLayer);
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').style.display = 'block';
      document.getElementById('overlay').style.display = 'block';
    }

    function closeAllModals() {
      document.querySelectorAll('.modal').forEach(function(m) { m.style.display = 'none'; });
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('searchResults').style.display = 'none';
    }

    // 3. Autentizace s kontrolou ověření e-mailu
    function updateUserUI(user) {
      currentUser = user;
      var statusBox = document.getElementById('userAccountText');
      var authFields = document.getElementById('authFieldsSection');
      var logoutSec = document.getElementById('logoutSection');

      if (user) {
        statusBox.innerHTML = "👤 Přihlášen:<br><strong>" + escapeHtml(user.email) + "</strong>";
        authFields.style.display = 'none';
        logoutSec.style.display = 'block';
      } else {
        statusBox.innerText = "Nepřihlášený uživatel";
        authFields.style.display = 'block';
        logoutSec.style.display = 'none';
      }
      loadPointsFromCloud();
    }

    async function checkAuth() {
      var res = await db.auth.getSession();
      updateUserUI(res.data.session ? res.data.session.user : null);
      db.auth.onAuthStateChange(function(_event, session) {
        updateUserUI(session ? session.user : null);
      });
    }

    async function handleLogin() {
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value.trim();
      if (!email || !password) { alert("Zadej e-mail i heslo!"); return; }
      
      var res = await db.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        var msg = res.error.message.toLowerCase();
        if (msg.includes("email not confirmed")) {
          alert("Tvůj účet ještě není aktivní! Otevři svůj e-mail (" + email + ") a klikni na ověřovací odkaz. Zkontroluj i složku Spam.");
        } else if (msg.includes("invalid login credentials")) {
          alert("Nesprávný e-mail nebo heslo.");
        } else {
          alert("Chyba přihlášení: " + res.error.message);
        }
      } else {
        closeAllModals();
      }
    }

    async function handleRegister() {
      var email = document.getElementById('authEmail').value.trim();
      var password = document.getElementById('authPassword').value.trim();
      if (!email || !password || password.length < 6) {
        alert("Zadej platný e-mail a heslo s délkou alespoň 6 znaků!");
        return;
      }

      var res = await db.auth.signUp({
        email: email,
        password: password,
        options: {
          emailRedirectTo: window.location.origin + window.location.pathname
        }
      });

      if (res.error) {
        alert("Chyba při registraci: " + res.error.message);
      } else {
        alert("✅ Registrace byla úspěšná!\n\nNa e-mail " + email + " jsme ti poslali potvrzovací odkaz. Až na něj klikneš, účet se aktivuje a můžeš se přihlásit.");
        closeAllModals();
      }
    }

    async function handleLogout() {
      await db.auth.signOut();
      closeAllModals();
    }

    // 4. Univerzální akční menu pro libovolný bod (včetně aktuální polohy)
    function openPointActionPopup(lat, lng, labelText, isCurrentPos) {
      var navUrl = "https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng;

      var popupContent = document.createElement('div');
      popupContent.innerHTML = 
        '<div style="min-width:205px;">' +
          '<strong style="display:block;font-size:14px;margin-bottom:8px;color:#0f172a;">' + labelText + '</strong>' +
          (!isCurrentPos ? '<button id="btnPlanPopup" class="btn btn-primary" style="width:100%;margin-bottom:6px;padding:7px;">🗺️ Trasa z mé polohy</button>' : '') +
          '<button id="btnAddPopup" class="btn btn-primary" style="width:100%;margin-bottom:6px;padding:7px;background:#10b981;">➕ Přidat nové místo zde</button>' +
          '<a href="' + navUrl + '" target="_blank" class="btn btn-secondary" style="display:block;text-align:center;text-decoration:none;padding:7px;font-size:13px;">🧭 Otevřít v Google Mapách</a>' +
        '</div>';

      if (!isCurrentPos) {
        popupContent.querySelector('#btnPlanPopup').onclick = function() {
          calculateAndDrawRoute(lat, lng);
          map.closePopup();
        };
      }

      popupContent.querySelector('#btnAddPopup').onclick = function() {
        openAddPlaceModal(lat, lng);
        map.closePopup();
      };

      L.popup().setLatLng([lat, lng]).setContent(popupContent).openOn(map);
    }

    // 5. GPS zaměření s klikacím bodem
    function locateMe() {
      if (!navigator.geolocation) {
        map.setView([49.8175, 15.4730], 9);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          userCurrentPos = { lat: lat, lng: lng };

          if (userLocationMarker) map.removeLayer(userLocationMarker);

          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 10,
            fillColor: '#0284c7',
            color: '#ffffff',
            weight: 3,
            fillOpacity: 1
          }).addTo(map);

          // Kliknutím na modrý bod se otevře menu s možností "Přidat místo"
          userLocationMarker.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            openPointActionPopup(lat, lng, "📍 Moje aktuální poloha", true);
          });

          map.setView([lat, lng], 14);
          openPointActionPopup(lat, lng, "📍 Moje aktuální poloha", true);
        },
        function(error) {
          alert("GPS signál není dostupný nebo aplikace nemá povolený přístup k poloze.");
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    }

    // 6. Kliknutí a dlouhý stisk do mapy
    map.on('click', function(e) {
      if (document.getElementById('searchResults').style.display === 'block') {
        document.getElementById('searchResults').style.display = 'none';
        return;
      }
      openPointActionPopup(e.latlng.lat, e.latlng.lng, "📍 Vybraný bod", false);
    });

    var pressTimer;
    map.on('mousedown touchstart', function(e) {
      if (e.originalEvent.touches && e.originalEvent.touches.length > 1) return;
      pressTimer = setTimeout(function() {
        openAddPlaceModal(e.latlng.lat, e.latlng.lng);
      }, 650);
    });
    map.on('mouseup touchend dragstart', function() { clearTimeout(pressTimer); });

    // 7. Plánování trasy
    async function calculateAndDrawRoute(destLat, destLng) {
      if (!userCurrentPos) {
        locateMe();
        alert("Zjišťuji GPS polohu... Až se mapa zaměří, klikni na plánování trasy znovu.");
        return;
      }

      var url = "https://router.project-osrm.org/route/v1/driving/" + userCurrentPos.lng + "," + userCurrentPos.lat + ";" + destLng + "," + destLat + "?overview=full&geometries=geojson";

      try {
        var res = await fetch(url);
        var data = await res.json();
        if (!data.routes || data.routes.length === 0) { alert("Trasa nenalezena."); return; }

        var route = data.routes[0];
        routeLayerGroup.clearLayers();
        var routeLine = L.geoJSON(route.geometry, { style: { color: '#2563eb', weight: 6, opacity: 0.85 } }).addTo(routeLayerGroup);

        map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
        document.getElementById('routeDistance').innerText = (route.distance / 1000).toFixed(1) + " km";
        document.getElementById('routeTime').innerText = Math.round(route.duration / 60) + " min";
        document.getElementById('extNavBtn').href = "https://www.google.com/maps/dir/?api=1&destination=" + destLat + "," + destLng;
        document.getElementById('routeInfoCard').style.display = 'block';

        closeAllModals();
      } catch (err) {
        alert("Chyba při výpočtu trasy.");
      }
    }

    function clearRoute() {
      routeLayerGroup.clearLayers();
      document.getElementById('routeInfoCard').style.display = 'none';
    }

    // 8. Hledání v mapě
    async function searchLocation() {
      var q = document.getElementById('searchInput').value.trim();
      var resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = "";
      if (!q) { resultsDiv.style.display = "none"; return; }

      try {
        var res = await fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(q) + "&limit=4");
        var placesFound = await res.json();
        if (placesFound.length === 0) {
          resultsDiv.innerHTML = '<div class="search-item">Místo nenalezeno</div>';
        } else {
          placesFound.forEach(function(item) {
            var row = document.createElement('div');
            row.className = 'search-item';
            row.innerHTML = '📍 <strong>' + escapeHtml(item.display_name.split(',')[0]) + '</strong> <small style="color:#64748b;">' + escapeHtml(item.display_name) + '</small>';
            row.onclick = function() {
              var targetLat = parseFloat(item.lat);
              var targetLon = parseFloat(item.lon);
              map.setView([targetLat, targetLon], 13);
              resultsDiv.style.display = "none";
              openPointActionPopup(targetLat, targetLon, escapeHtml(item.display_name.split(',')[0]), false);
            };
            resultsDiv.appendChild(row);
          });
        }
        resultsDiv.style.display = "block";
      } catch (e) { console.error(e); }
    }

    // 9. Ukládání a načítání bodů
    async function loadPointsFromCloud() {
      var res = await db.from('places').select('*');
      var rawPlaces = res.data || [];
      places = rawPlaces.filter(function(pt) {
        if (!pt.is_private) return true;
        return currentUser && pt.user_id === currentUser.id;
      });
      renderMarkers();
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      places.forEach(function(pt) {
        var parts = pt.category.split('|');
        var emoji = parts[0], catColor = parts[2] || '#2563eb';
        if (pt.is_private) emoji = '🔒';

        var pinHtml = '<div class="pin-wrap">' +
            '<svg width="38" height="48" viewBox="0 0 30 40">' +
              '<path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 25 15 25s15-14.5 15-25c0-8.3-6.7-15-15-15z" fill="' + (pt.is_private ? '#475569' : catColor) + '"/>' +
              '<circle cx="15" cy="14" r="9" fill="white"/>' +
            '</svg>' +
            '<div class="pin-icon">' + emoji + '</div>' +
          '</div>';

        var customIcon = L.divIcon({ className: 'custom-pin', html: pinHtml, iconSize: [38, 48], iconAnchor: [19, 48] });
        var marker = L.marker([pt.lat, pt.lng], { icon: customIcon });
        marker.on('click', function(e) {
          L.DomEvent.stopPropagation(e);
          openPlaceDetail(pt);
        });
        markersLayer.addLayer(marker);
      });
    }

    function openAddPlaceModal(lat, lng) {
      if (!currentUser) {
        alert("Pro vytvoření místa se nejprve přihlas v nastavení (⚙️).");
        openSettingsModal();
        return;
      }
      document.getElementById('pLat').value = lat;
      document.getElementById('pLng').value = lng;
      document.getElementById('pTitle').value = "";
      document.getElementById('pPrivacy').value = "false";
      document.getElementById('pDesc').value = "";
      document.getElementById('pPhoto').value = "";
      document.getElementById('pPreview').style.display = "none";
      tempPhotoBase64 = "";

      document.getElementById('placeModal').style.display = 'block';
      document.getElementById('overlay').style.display = 'block';
    }

    async function savePlaceToCloud() {
      var title = document.getElementById('pTitle').value.trim();
      if (!title) { alert("Zadej název místa."); return; }

      var newPlace = {
        title: title,
        lat: parseFloat(document.getElementById('pLat').value),
        lng: parseFloat(document.getElementById('pLng').value),
        category: document.getElementById('pCategory').value,
        description: document.getElementById('pDesc').value.trim(),
        photo: tempPhotoBase64,
        is_private: document.getElementById('pPrivacy').value === "true",
        user_id: currentUser.id,
        user_email: currentUser.email
      };

      var res = await db.from('places').insert([newPlace]);
      if (res.error) alert("Chyba při ukládání: " + res.error.message);
      else {
        closeAllModals();
        loadPointsFromCloud();
      }
    }

    async function openPlaceDetail(place) {
      currentDetailPlace = place;
      var parts = place.category.split('|');
      var emoji = parts[0], catName = parts[1], catColor = parts[2] || '#2563eb';

      document.getElementById('dTitle').innerText = (place.is_private ? '🔒 ' : emoji + ' ') + place.title;
      var badgeHtml = '<span style="background:' + catColor + ';color:white;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold;">' + catName + '</span>';
      if (place.is_private) {
        badgeHtml += '<span style="background:#475569;color:white;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold;">🔒 Moje soukromé</span>';
      }
      document.getElementById('dCategoryBadge').innerHTML = badgeHtml;
      document.getElementById('dDesc').innerText = place.description || "Bez dalšího popisu.";
      document.getElementById('dAuthor').innerText = "Vložil: " + (place.user_email ? place.user_email.split('@')[0] : 'Uživatel');
      
      document.getElementById('dNavBtn').href = "https://www.google.com/maps/dir/?api=1&destination=" + place.lat + "," + place.lng;
      document.getElementById('dPlanRouteBtn').onclick = function() {
        calculateAndDrawRoute(place.lat, place.lng);
      };

      var isOwner = currentUser && currentUser.id === place.user_id;
      document.getElementById('ownerActions').style.display = isOwner ? 'block' : 'none';

      loadReviewsAndGallery(place);
      document.getElementById('detailModal').style.display = 'block';
      document.getElementById('overlay').style.display = 'block';
    }

    async function loadReviewsAndGallery(place) {
      var gallery = document.getElementById('dGallery');
      gallery.innerHTML = "";
      if (place.photo) gallery.innerHTML += '<img src="' + place.photo + '">';

      var res = await db.from('reviews').select('*').eq('place_id', place.id).order('created_at', { ascending: false });
      var reviews = res.data;
      var list = document.getElementById('reviewsList');
      list.innerHTML = "";

      if (!reviews || reviews.length === 0) {
        list.innerHTML = '<small style="color:#94a3b8;">Zatím žádné recenze.</small>';
      } else {
        reviews.forEach(function(r) {
          if (r.photo) gallery.innerHTML += '<img src="' + r.photo + '">';
          list.innerHTML += 
            '<div class="review-card">' +
              '<div style="font-weight:bold;font-size:12px;display:flex;justify-content:space-between;">' +
                '<span>' + (r.user_email ? r.user_email.split('@')[0] : 'Karavanista') + '</span>' +
                '<span>' + "⭐".repeat(r.rating) + '</span>' +
              '</div>' +
              '<p style="font-size:13px;color:#475569;margin-top:4px;">' + escapeHtml(r.comment || '') + '</p>' +
            '</div>';
        });
      }
    }

    async function submitReview() {
      if (!currentUser) { alert("Pro recenzi se nejdříve přihlas v nastavení (⚙️)!"); openSettingsModal(); return; }
      var comment = document.getElementById('rComment').value.trim();
      var rating = parseInt(document.getElementById('rStars').value);

      var res = await db.from('reviews').insert([{
        place_id: currentDetailPlace.id,
        user_id: currentUser.id,
        user_email: currentUser.email,
        rating: rating,
        comment: comment,
        photo: tempReviewPhotoBase64
      }]);

      if (res.error) alert("Chyba při ukládání: " + res.error.message);
      else {
        document.getElementById('rComment').value = "";
        document.getElementById('rPhoto').value = "";
        document.getElementById('rPreview').style.display = "none";
        tempReviewPhotoBase64 = "";
        loadReviewsAndGallery(currentDetailPlace);
      }
    }

    async function deletePlaceAsOwner() {
      if (!confirm("Opravdu smazat toto místo?")) return;
      var res = await db.from('places').delete().eq('id', currentDetailPlace.id);
      if (res.error) alert("Chyba: " + res.error.message);
      else {
        closeAllModals();
        loadPointsFromCloud();
      }
    }

    function previewImage(event, previewId) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var maxDim = 800;
          var w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var b64 = canvas.toDataURL('image/jpeg', 0.65);
          if (previewId === 'pPreview') tempPhotoBase64 = b64;
          else tempReviewPhotoBase64 = b64;
          var p = document.getElementById(previewId);
          p.src = b64; p.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function escapeHtml(t) { return (t || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    checkAuth();
    loadPointsFromCloud();
  </script>
</body>
</html>
